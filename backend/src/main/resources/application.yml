server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: logistics-controltower
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/logistics_controltower?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${DB_USERNAME:logistics}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    time-zone: UTC
  servlet:
    multipart:
      max-file-size: 2MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    jwt-secret: ${JWT_SECRET}
    jwt-ttl: ${JWT_TTL:PT15M}
    cors-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
